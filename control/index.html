<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#111111">
  <title>Sodruzhestvo Control</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/site/img/logo (2).png">
  <link rel="stylesheet" href="/control/css/control.min.css">
</head>
<body class="control-page">
  <aside class="sidebar" id="sidebar">
    <a href="#dashboard" class="brand" aria-label="Главная Sodruzhestvo Control">
      <img src="/site/img/logo (2).png" alt="">
      <span><strong>Содружество</strong><small>Control</small></span>
    </a>
    <nav class="main-nav" aria-label="Разделы системы">
      <a href="#dashboard" data-route="dashboard"><span>ГЛ</span>Главная</a>
      <a href="#athletes" data-route="athletes"><span>СП</span>Спортсмены</a>
      <a href="#groups" data-route="groups"><span>ГР</span>Группы</a>
      <a href="#attendance" data-route="attendance"><span>ПО</span>Посещения</a>
      <a href="#payments" data-route="payments"><span>ОП</span>Оплаты</a>
      <a href="#calendar" data-route="calendar"><span>КЛ</span>Календарь</a>
      <a href="#personal" data-route="personal"><span>МП</span>Мои персоналки</a>
      <a href="#tasks" data-route="tasks"><span>ЗД</span>Задачи</a>
      <a href="#expenses" data-route="expenses"><span>РС</span>Расходы</a>
      <a href="#statistics" data-route="statistics"><span>СТ</span>Статистика</a>
      <a href="#settings" data-route="settings"><span>НС</span>Настройки</a>
    </nav>
    <div class="sidebar-footer">
      <p id="sidebar-user"></p>
      <button class="button button--ghost button--wide" data-action="logout">Выйти</button>
    </div>
  </aside>

  <div class="app-shell">
    <header class="app-header">
      <button class="icon-button mobile-menu" id="mobile-menu" aria-label="Открыть меню" aria-expanded="false">☰</button>
      <div>
        <p class="eyebrow" id="page-eyebrow">Управление клубом</p>
        <h1 id="page-title">Главная</h1>
      </div>
      <button class="icon-button" data-action="enable-push" aria-label="Включить уведомления" title="Уведомления">●</button>
    </header>
    <main id="app" class="app-content" tabindex="-1">
      <div class="loading-state"><span class="spinner"></span><p>Загрузка данных</p></div>
    </main>
  </div>

  <nav class="mobile-nav" aria-label="Быстрая навигация">
    <a href="#dashboard" data-route="dashboard">Главная</a>
    <a href="#attendance" data-route="attendance">Посещения</a>
    <a href="#personal" data-route="personal">Персоналки</a>
    <a href="#tasks" data-route="tasks">Задачи</a>
  </nav>

  <div class="modal" id="modal" hidden>
    <div class="modal-backdrop" data-action="close-modal"></div>
    <section class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <header><h2 id="modal-title"></h2><button class="icon-button" data-action="close-modal" aria-label="Закрыть">×</button></header>
      <div id="modal-body"></div>
    </section>
  </div>
  <div class="toast-region" id="toasts" aria-live="polite"></div>
  <script src="/control/js/control.js" defer></script>
</body>
</html>
