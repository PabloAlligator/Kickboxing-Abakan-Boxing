<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#111111">
  <title>Вход — Sodruzhestvo Control</title>
  <link rel="icon" href="/site/img/logo (2).png">
  <link rel="stylesheet" href="/control/css/control.min.css">
</head>
<body class="login-page">
  <main class="login-shell">
    <section class="login-card" aria-labelledby="login-title">
      <img src="/site/img/logo (2).png" alt="Содружество" class="login-logo">
      <p class="eyebrow">Закрытая система клуба</p>
      <h1 id="login-title">Sodruzhestvo Control</h1>
      <p class="muted">Вход только для владельцев клуба</p>
      <form id="login-form" class="stack-form" novalidate>
        <label>Электронная почта
          <input type="email" name="email" autocomplete="username" required>
        </label>
        <label>Пароль
          <input type="password" name="password" autocomplete="current-password" minlength="12" required>
        </label>
        <p id="login-error" class="form-message form-message--error" hidden></p>
        <button class="button button--primary button--wide" type="submit">Войти</button>
      </form>
      <a class="text-link" href="/">Вернуться на сайт клуба</a>
    </section>
  </main>
  <script src="/control/js/login.js" defer></script>
</body>
</html>
