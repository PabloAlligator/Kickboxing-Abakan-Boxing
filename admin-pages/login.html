<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="theme-color" content="#111111">
  <title>Вход в Control — Содружество</title>
  <link rel="icon" href="/site/img/logo (2).png">
  <link rel="stylesheet" href="/site/css/admin.min.css">
  <script src="/site/scripts/admin/login.js" defer></script>
</head>
<body class="admin-login-page">
  <main class="admin-login">
    <section class="admin-login__media" aria-label="Бойцовский клуб Содружество">
      <img class="admin-login__media-image" src="/site/img/gym2.jpg" alt="">
      <div class="admin-login__media-overlay" aria-hidden="true"></div>
      <a class="admin-login__brand" href="/" aria-label="На сайт Содружества">
        <img src="/site/img/logo (2).png" alt="">
        <span>Содружество</span>
      </a>
      <div class="admin-login__media-content">
        <span class="admin-login__media-caption">Бойцовский клуб · Абакан</span>
        <p class="admin-login__media-text">Закрытая система учёта спортсменов, тренировок и работы клуба.</p>
      </div>
    </section>

    <section class="admin-login__content">
      <div class="admin-login__form-wrap">
        <div class="admin-login__heading">
          <span class="admin-login__caption">ShumDev Custom Control</span>
          <h1 class="admin-login__title">Вход в Control</h1>
          <p class="admin-login__description">Введите личный логин и пароль владельца клуба.</p>
        </div>

        <form id="login-form" class="admin-login__form" novalidate>
          <div class="admin-field">
            <label class="admin-field__label" for="admin-login">Логин</label>
            <input class="admin-field__input" id="admin-login" name="login" type="text" autocomplete="username" maxlength="32" placeholder="Введите логин" required>
          </div>

          <div class="admin-field">
            <label class="admin-field__label" for="admin-password">Пароль</label>
            <div class="admin-field__password">
              <input class="admin-field__input admin-field__input--password" id="admin-password" name="password" type="password" autocomplete="current-password" maxlength="128" placeholder="Введите пароль" required>
              <button class="admin-field__password-toggle" type="button" aria-label="Показать пароль" aria-pressed="false" data-password-toggle>Показать</button>
            </div>
          </div>

          <p id="login-error" class="admin-login__message" role="alert" hidden></p>
          <button class="admin-login__submit" type="submit">
            <span data-login-submit-text>Войти</span>
            <span class="admin-login__loader" aria-hidden="true" hidden data-login-loader></span>
          </button>
        </form>

        <div class="admin-login__security">
          <span aria-hidden="true">●</span>
          <p>Доступ только для владельцев клуба. Все критичные действия журналируются.</p>
        </div>
        <a class="admin-login__back" href="/">Вернуться на сайт</a>
      </div>
    </section>
  </main>
</body>
</html>
